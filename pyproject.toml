[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hf-genealogy"
version = "1.0"
description = "Shared loader for the Hugging Face model genealogy network"
requires-python = ">=3.13"

[tool.setuptools]
py-modules = ["load"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "data: needs the real frozen files in data/",
    "slow: long statistical or calibration runs",
]
